[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.agents", "app.api", "app.services", "data", "scripts"]

[project]
name = "bt-contact-centre-demo"
version = "0.1.0"
description = "BT Next-Gen Contact Centre Multi-Agent Operational Customer 360 Demo"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "motor>=3.6",
    "pymongo>=4.9",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "faker>=30",
    "jsonschema>=4.23",
    "websockets>=13",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["ruff>=0.7", "pytest>=8"]

[tool.ruff]
line-length = 100
target-version = "py311"
